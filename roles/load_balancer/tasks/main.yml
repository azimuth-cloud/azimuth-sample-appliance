---
- name: Configure Nginx
  tasks:
    - name: Install Nginx site config
      ansible.builtin.template:
        src: nginx.conf.j2
        dest: /etc/nginx/conf.d/sample-appliance.conf
        mode: '0644'
      notify: Restart Nginx

  handlers:
    - name: Restart Nginx
      ansible.builtin.service:
        name: nginx
        state: restarted
